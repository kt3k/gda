name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          PAGES_BASE_PATH: /gda
          # KaTeX をビルド時に HTML 展開するためメモリを多めに要する
          # (public リポジトリの ubuntu-latest ランナーは 4 コア / RAM 16GB)
          NODE_OPTIONS: --max-old-space-size=8192
      # waku の静的出力ルートは dist/public/
      - run: touch site/dist/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
